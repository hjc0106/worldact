device: cuda

prepare:
  target_count: 32
  horizontal_targets: 32
  high_elevation_targets: 0
  low_elevation_targets: 0
  sphere_ring: true
  ring_elevation_deg: 12.0
  circumradius_scale: 1.5
  look_at_up_bias: 0.08
  min_elevation_deg: 8.0
  look_at_robust_center: true
  image_size: 512
  fov_deg: 60.0
  edge_margin: 0.12
  quantile: [0.02, 0.98]
  target_anchor_min_angle_deg: 0.0
  # Stage-1 SAM masks on parking-lot frames cover ~0.1%–0.5% of the image.
  min_mask_area_ratio: 0.0005
  max_mask_area_ratio: 0.95
  max_boundary_edges: 4
  angular_dedup_deg: 10.0
  camera_distance_scale: 2.2
